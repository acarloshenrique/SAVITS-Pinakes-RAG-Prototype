    <linearGradient id="cardB" x1="520" y1="132" x2="1050" y2="344" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ECFDF5"/>
      <stop offset="1" stop-color="#A7F3D0"/>
    </linearGradient>
    <linearGradient id="cardC" x1="1112" y1="132" x2="1474" y2="344" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FEF3C7"/>
      <stop offset="1" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="cardD" x1="520" y1="418" x2="1050" y2="734" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EDE9FE"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="cardE" x1="1112" y1="418" x2="1474" y2="734" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FEE2E2"/>
