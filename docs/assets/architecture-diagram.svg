      <stop stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#0B3B52"/>
      <stop offset="1" stop-color="#164E63"/>
    </linearGradient>
    <linearGradient id="cardA" x1="116" y1="132" x2="452" y2="344" gradientUnits="userSpaceOnUse">
